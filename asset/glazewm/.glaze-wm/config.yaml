general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []

  # Match komorebi: mouse_follows_focus: false
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  # Match komorebi: window_hiding_behaviour: Cloak, show_all_in_taskbar: false
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true

  # Match komorebi: default_container_padding: 10
  inner_gap: '10px'

  # Match komorebi: global_work_area_offset left:-15 right:-30 top:-15 bottom:-30
  outer_gap:
    top: '5px'
    right: '5px'
    bottom: '5px'
    left: '5px'

window_effects:
  focused_window:
    # Match komorebi: border: true, border_width: 2, border_style: Square
    border:
      enabled: true
      color: '#8dbcff'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '100%'

  other_windows:
    border:
      enabled: true
      color: '#a1a1a1'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# 3 named workspaces minimum (I/II/III matching komorebi), rest numbered
workspaces:
  - name: '1'
    display_name: 'I'
  - name: '2'
    display_name: 'II'
  - name: '3'
    display_name: 'III'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  # ── Ignored apps (from komorebi ignore_rules) ──────────────────────────────
  - commands: ['ignore']
    match:
      - window_process: { equals: 'AutoHotkey' }
      - window_process: { equals: 'PSUAConsole' }
      - window_process: { equals: 'scrcpy' }
      - window_process: { equals: 'kdeconnect-app' }
      - window_process: { equals: 'vmware' }
      - window_process: { equals: 'PowerToys.FileLocksmithUI' }
      - window_process: { regex: 'Cloudflare WARP' }
      - window_process: { equals: 'qbittorrent' }
      - window_process: { equals: '7zFM' }
      - window_process: { equals: 'GlassWire' }
      - window_process: { equals: 'fdm' }
      - window_process: { regex: 'Riot Client' }
      - window_title: { equals: 'Picture-in-picture' }
      - window_process: { equals: 'PowerToys.Settings' }
      - window_process: { equals: 'PotPlayerMini64' }
      - window_process: { equals: 'WorkspaceUtilities' }
      - window_process: { regex: 'VALORANT-Win64-Shipping' }
      - window_process: { equals: 'mylbx' }
      - window_process: { equals: 'DesktopCoral' }
      - window_process: { equals: 'LosslessScaling' }
      - window_process: { equals: 'VirtualBox' }
      - window_process: { equals: 'VirtualBoxVM' }
      - window_process: { equals: 'localsend_app' }
      - window_process: { equals: 'crosvm' }
      - window_title: { equals: 'WhatsApp' }
      - window_process: { equals: 'PCHealthCheck' }
      - window_process: { equals: 'WsaClient' }
      - window_process: { equals: 'MuMuPlayer' }
      - window_process: { equals: 'ChatGPT' }
      - window_title: { equals: 'Enhancer for YouTube' }
      - window_title: { equals: 'OS_v2' }
      - window_title: { equals: 'Status Bar' }
      - window_process: { equals: 'emacs' }
      - window_title: { equals: 'WHKD Keybinds' }
      - window_class: { equals: 'VbaWindow' }
      - window_class: { equals: 'wndclass_desked_gsk' }
      - window_process: { equals: 'sniffnet' }
      - window_process: { equals: 'Qwen' }
      - window_title: { regex: '.*Character Map UWP.*' }
      - window_process: { equals: 'mspaint' }
      - window_process: { equals: 'google' }
      - window_title: { equals: 'Bitwarden' }
      - window_process: { regex: 'T3 Code' }
      - window_process: { equals: 'input-leap' }
      - window_process: { equals: 'deskflow' }
      - window_process: { equals: 'RustDesk' }
      - window_process: { equals: 'Freebuff' }
      - window_class: { regex: 'Qt6\d+QWindowIcon' }
      - window_class: { equals: 'ConsoleWindowClass' }
      - window_class: { equals: 'CASCADIA_HOSTING_WINDOW_CLASS' }
      - window_process: { equals: 'explorer' }

  # ── Floating apps (from komorebi tray_and_multi_window_applications) ────────
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'rssguard' }
      - window_process: { equals: 'Text-Grab' }
      - window_process: { equals: 'OpenVPNConnect' }
      - window_process: { equals: 'ABDownloadManager' }
      - window_process: { equals: 'JDownloader2' }
      - window_class: { equals: 'WGA_MainWindow' }
      - window_process: { equals: 'UniGetUI' }
      - window_process: { equals: 'Photos' }
      - window_process: { equals: 'Podman Desktop' }
      # python/pythonw spawn GUI tools that shouldn't tile
      - window_process: { equals: 'python' }
      - window_process: { equals: 'pythonw' }
      - window_process: { equals: 'WhatsApp.Root' }

  # ── Standard glazewm ignores ──────────────────────────────────────────────
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+shift+q']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']
  - commands: ['shell-exec pwsh']
    bindings: ['alt+enter']

  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']

  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+a']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+f']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+shift+d']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+shift+s']

  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
