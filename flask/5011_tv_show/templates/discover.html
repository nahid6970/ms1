<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover | TV Shows & Movies</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="sticky-controls-wrapper">
        <div class="app-header-inner">
            <nav class="library-nav" aria-label="Library sections">
                <a href="{{ url_for('index') }}" class="nav-link">Shows</a>
                <a href="{{ url_for('movies_page') }}" class="nav-link">Movies</a>
                <a href="{{ url_for('discover_page') }}" class="nav-link active">Discover</a>
            </nav>
        </div>
    </div>

    <main class="discover-page">
        <form id="discoverSearchForm" class="discover-search-form">
            <input id="discoverQuery" type="search" placeholder="Search" autocomplete="off">
            <select id="discoverType" aria-label="Content type">
                <option value="all">Media</option>
                <option value="movie">Movies</option>
                <option value="tv">TV Shows</option>
            </select>
            <select id="discoverPreset" aria-label="Discovery mode" hidden>
                <option value="search">Search Titles</option>
                <option value="popular">Popular</option>
                <option value="top_rated">Top Rated</option>
                <option value="trending_month">Trending Month</option>
            </select>
            <select id="discoverRegion" aria-label="Region filter" hidden>
                <option value="none">No Region</option>
                <option value="hollywood">Hollywood</option>
                <option value="bollywood">Bollywood</option>
                <option value="tamil_telugu">South</option>
                <option value="anime">Anime</option>
                <option value="korean">Korean</option>
                <option value="chinese">Chinese</option>
                <option value="japanese_live">Japanese Live Action</option>
                <option value="animation">Cartoons / Animation</option>
                <option value="documentary_reality">Documentary / Reality</option>
            </select>
            <div class="dc-preset-dropdown" id="dcPresetDropdown">
                <button class="dc-preset-btn" id="dcPresetBtn" type="button" title="Discovery mode" aria-haspopup="listbox" aria-expanded="false">
                    <span id="dcPresetModeIcon" class="dc-preset-mode-icon" aria-hidden="true"></span>
                    <span id="dcPresetLabel" class="dc-preset-mode-label">Search</span>
                    <span class="dc-preset-plus" aria-hidden="true">+</span>
                    <span id="dcPresetRegionLabel">All</span>
                </button>
                <div class="dc-preset-menu" id="dcPresetMenu" aria-label="Discovery mode">
                    <button class="dc-preset-row active" data-group="mode" data-value="search"         type="button"><span>Search</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="mode" data-value="popular"        type="button"><span>Popular</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="mode" data-value="top_rated"      type="button"><span>Top Rated</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="mode" data-value="trending_month" type="button"><span>Trending</span><span class="dc-radio"></span></button>
                    <div class="dc-preset-divider"></div>
                    <button class="dc-preset-row"        data-group="region" data-value="none"         type="button"><span>All</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="hollywood"    type="button"><span>Hollywood</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="bollywood"    type="button"><span>Bollywood</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="tamil_telugu" type="button"><span>South</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="anime"        type="button"><span>Anime</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="korean"       type="button"><span>Korean</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="chinese"      type="button"><span>Chinese</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="japanese_live" type="button"><span>Japanese Live Action</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="animation"   type="button"><span>Cartoons / Animation</span><span class="dc-radio"></span></button>
                    <button class="dc-preset-row"        data-group="region" data-value="documentary_reality" type="button"><span>Documentary / Reality</span><span class="dc-radio"></span></button>
                </div>
            </div>
            <select id="discoverSort" class="discover-sort" aria-label="Sort results">
                <option value="relevance">Relevance</option>
                <option value="latest" selected>Latest First</option>
                <option value="oldest">Oldest First</option>
            </select>
            <input id="discoverLimit" class="discover-limit" type="number" min="1" max="100" value="20" aria-label="Number of results" title="Number of results" placeholder="20">
            <button type="submit" class="modal-btn modal-btn-blue">Search</button>
        </form>

        <section id="discoverResults" class="discover-results" aria-live="polite"></section>
        <div id="discoverStatus" class="discover-status"></div>
        <div id="discoverPagination" class="discover-pagination" hidden>
            <button id="discoverPrevious" class="modal-btn modal-btn-dark" type="button">Previous</button>
            <span id="discoverPageLabel"></span>
            <button id="discoverNext" class="modal-btn modal-btn-dark" type="button">Next</button>
        </div>
    </main>

    <script src="{{ url_for('static', filename='discover.js') }}"></script>
</body>
</html>
