<!-- The Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content settings-modal-content">
        <span class="close" onclick="closeSettingsModal()">&times;</span>
        <h2 class="modal-title">Settings</h2>

        <div class="settings-grid">
            <div class="settings-panel settings-panel-general">
                <!-- General Settings Section -->
                <div class="settings-section section-general">
            <h3>
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                General
            </h3>

            <div class="setting-row">
                <label for="showHiddenShows">Show Hidden Shows</label>
                <label class="switch">
                    <input type="checkbox" id="showHiddenShows">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-row">
                <label for="defaultShowsSort">Default Shows Sort</label>
                <select id="defaultShowsSort" class="modal-input">
                    <option value="title">Title</option>
                    <option value="year">Year</option>
                    <option value="rating">Rating</option>
                    <option value="added">Added</option>
                    <option value="last_episode">Last Episode</option>
                </select>
            </div>

            <div class="setting-row">
                <label for="defaultShowsOrder">Shows Sort Order</label>
                <select id="defaultShowsOrder" class="modal-input">
                    <option value="asc">ASC</option>
                    <option value="desc">DESC</option>
                </select>
            </div>

            <div class="setting-row">
                <label for="defaultMoviesSort">Default Movies Sort</label>
                <select id="defaultMoviesSort" class="modal-input">
                    <option value="title">Title</option>
                    <option value="year">Year</option>
                    <option value="rating">Rating</option>
                    <option value="added">Added</option>
                </select>
            </div>

            <div class="setting-row">
                <label for="defaultMoviesOrder">Movies Sort Order</label>
                <select id="defaultMoviesOrder" class="modal-input">
                    <option value="asc">ASC</option>
                    <option value="desc">DESC</option>
                </select>
            </div>
                </div>
            </div>

            <div class="settings-panel settings-panel-integrations">
                <!-- TMDb Integration Section -->
                <div class="settings-section section-tmdb">
            <h3>
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 4v16"></path><path d="M3 8h4"></path><path d="M3 12h4"></path><path d="M3 16h4"></path><path d="M17 4v16"></path></svg>
                TMDb Metadata
            </h3>

            <div class="setting-row">
                <label for="tmdbApiKey">TMDb API Key</label>
                <input type="password" id="tmdbApiKey" class="modal-input" placeholder="Paste TMDb API key here" autocomplete="off">
            </div>
                </div>

                <!-- Sonarr Integration Section -->
                <div class="settings-section section-sonarr">
            <h3>
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
                Sonarr Connection
            </h3>

            <div class="setting-row">
                <label for="sonarrApiUrl">Sonarr URL</label>
                <input type="text" id="sonarrApiUrl" class="modal-input" placeholder="http://192.168.0.101:8989">
            </div>

            <div class="setting-row">
                <label for="sonarrApiKey">Sonarr API Key</label>
                <input type="password" id="sonarrApiKey" class="modal-input" placeholder="Paste API Key here">
            </div>

            <div class="setting-row">
                <label for="rootShowsFolder">Shows Download Path</label>
                <div class="setting-control-col">
                    <input type="text" id="rootShowsFolder" class="modal-input" placeholder="C:\Users\nahid\Downloads\@sonarr">
                    <button onclick="syncSonarrPaths(this)" class="modal-btn modal-btn-blue modal-btn-sm" title="Update paths in Sonarr and the database">Update Path</button>
                </div>
            </div>

            <div class="settings-test-row">
                <span id="sonarrTestStatus" class="test-status"></span>
                <button onclick="testSonarrConnection()" class="modal-btn modal-btn-blue">Test Connection</button>
            </div>
                </div>

                <!-- Radarr Integration Section -->
                <div class="settings-section section-radarr">
            <h3>
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                Radarr Connection
            </h3>

            <div class="setting-row">
                <label for="radarrApiUrl">Radarr URL</label>
                <input type="text" id="radarrApiUrl" class="modal-input" placeholder="http://192.168.0.101:7878">
            </div>

            <div class="setting-row">
                <label for="radarrApiKey">Radarr API Key</label>
                <input type="password" id="radarrApiKey" class="modal-input" placeholder="Paste API Key here">
            </div>

            <div class="setting-row">
                <label for="rootMoviesFolder">Movies Download Path</label>
                <div class="setting-control-col">
                    <input type="text" id="rootMoviesFolder" class="modal-input" placeholder="C:\Users\nahid\Downloads\@radarr">
                    <button onclick="syncRadarrPaths(this)" class="modal-btn modal-btn-orange modal-btn-sm" title="Update paths in Radarr and the database">Update Path</button>
                </div>
            </div>

            <div class="settings-test-row">
                <span id="radarrTestStatus" class="test-status"></span>
                <button onclick="testRadarrConnection()" class="modal-btn modal-btn-orange">Test Connection</button>
            </div>
                </div>
            </div>
        </div>

        <!-- Footer Controls -->
        <div class="settings-footer">
            <button onclick="saveSettings()" class="modal-btn modal-btn-green modal-btn-block">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Save Settings
            </button>
        </div>
    </div>
</div>
