<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | TV Shows & Movies</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon-agenda.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="agenda-page">
    <div class="sticky-controls-wrapper">
        <div class="app-header-inner">
            <nav class="library-nav" aria-label="Library sections">
                <a href="{{ url_for('agenda_page') }}" class="nav-link active"><svg class="nav-link-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg><span>Agenda</span></a>
                <a href="{{ url_for('index') }}" class="nav-link"><svg class="nav-link-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="15" rx="2"></rect><path d="m17 2-5 5-5-5M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"></path></svg><span>Shows</span></a>
                <a href="{{ url_for('movies_page') }}" class="nav-link"><svg class="nav-link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v14H3z"></path><path d="M8 7v14M16 7v14M5 11h.01M5 17h.01M19 11h.01M19 17h.01"></path></svg><span>Movies</span></a>
                <a href="{{ url_for('discover_page') }}" class="nav-link"><svg class="nav-link-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5M13 8l-1.5 4-4 1.5 4 1.5 1.5 4 1.5-4 4-1.5-4-1.5z"></path></svg><span>Discover</span></a>
            </nav>
        </div>
    </div>
    <main class="agenda-shell">
        <div class="agenda-heading">
            <div>
                <h1 class="modal-title">Agenda</h1>
            </div>
            <div class="agenda-header-actions">
                <div class="agenda-header-filters" role="group" aria-label="Date filters">
                    <button class="agenda-filter agenda-time-filter active" data-time-filter="all">ALL DATES</button>
                    <button class="agenda-filter agenda-time-filter" data-time-filter="today">TODAY</button>
                    <button class="agenda-filter agenda-time-filter" data-time-filter="afterwards">AFTERWARDS</button>
                    <button class="agenda-filter agenda-skip-complete" type="button" aria-pressed="false">SKIP COMPLETE</button>
                    <button class="agenda-filter agenda-movie-pending" data-filter="movie-pending" type="button" aria-pressed="false">MOVIES PENDING</button>
                </div>
                <button id="agendaRefresh" class="modal-btn modal-btn-blue" type="button">REFRESH</button>
            </div>
        </div>
        <div class="agenda-toolbar">
            <input id="agendaSearch" class="schedule-search-input" type="search" placeholder="Search title..." aria-label="Search agenda">
            <div class="agenda-filters" role="group" aria-label="Agenda filters">
                <button class="agenda-filter active" data-filter="all">ALL</button>
                <button class="agenda-filter" data-filter="tv">TV</button>
                <button class="agenda-filter" data-filter="movie">MOVIES</button>
                <button class="agenda-filter" data-filter="scheduled">UPCOMING</button>
                <button class="agenda-filter" data-filter="complete">COMPLETED</button>
            </div>
        </div>
        <div class="agenda-table-wrap">
            <table class="agenda-table">
            <thead><tr><th>TITLE</th><th>ACTIONS</th><th>NEXT RELEASE</th><th>SCHEDULING</th></tr></thead>
                <tbody id="agendaTableBody"><tr><td colspan="4" class="agenda-empty">Loading agenda...</td></tr></tbody>
            </table>
        </div>
    </main>
    <script src="{{ url_for('static', filename='agenda.js') }}"></script>
</body>
</html>
