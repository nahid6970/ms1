{% extends "base.html" %}
{% block title %}Settings | YouTube Notifier{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-white mb-8">Settings</h1>
    <form action="{{ url_for('settings') }}" method="POST" class="bg-slate-900 border border-slate-800 p-6">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-white font-medium">Show Seen Videos</h2>
                <p class="text-slate-500 text-xs">If enabled, you can categorize videos into All/Unseen/Seen.</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" name="show_seen" class="sr-only peer" {% if show_seen %}checked{% endif %}>
                <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
            </label>
        </div>
        <button type="submit" class="mt-6 bg-red-600 text-white px-6 py-2 text-sm font-semibold hover:bg-red-500 transition">Save Settings</button>
    </form>
</div>
{% endblock %}
