<!DOCTYPE html>
<html lang="en" class="min-h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myTUBE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#090d16',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body data-page="channels" class="min-h-full text-slate-100 flex flex-col font-sans antialiased selection:bg-red-500 selection:text-white">

    <div id="navbar"></div>

    <!-- Flash Messages -->
    <div id="flashMessages"></div>

    <!-- Main Content -->
    <main class="page-shell flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-bold text-white mb-8">Manage Channels</h1>

            <div class="soft-panel bg-slate-900/85 border border-slate-800 rounded-lg p-6 mb-8">
                <form id="addChannelForm" class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="channelUrl" name="url" placeholder="Paste YouTube Channel URL (e.g. @username)" required class="flex-1 bg-slate-950 border border-slate-700 rounded-none px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 transition">
                    <button type="submit" class="bg-red-600 hover:bg-red-500 text-white px-6 py-3 rounded-none text-sm font-semibold transition">
                        Add Channel
                    </button>
                </form>
            </div>

            <div id="channelList" class="space-y-3">
                <p class="text-slate-600 text-sm">Loading...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900/50 border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <p>YouTube Notifier App &bull; Built with Cloudflare Pages &amp; Convex &bull; Real-time RSS Feed Monitoring</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
