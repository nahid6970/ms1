<!DOCTYPE html>
<html lang="en" class="min-h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myTUBE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#090d16',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body data-page="stats" class="min-h-full text-slate-100 flex flex-col font-sans antialiased selection:bg-red-500 selection:text-white">

    <div id="navbar"></div>

    <!-- Flash Messages -->
    <div id="flashMessages"></div>

    <!-- Main Content -->
    <main class="page-shell flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-white">Stats</h1>
                <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-800">
                    <a href="?period=week" class="px-4 py-1 text-xs rounded-md transition capitalize">week</a>
                    <a href="?period=month" class="px-4 py-1 text-xs rounded-md transition capitalize">month</a>
                </div>
            </div>

            <div class="soft-panel bg-slate-900/85 border border-slate-800 rounded-lg p-6 overflow-x-auto">
                <div id="statsSummary" class="mb-5"></div>
                <div id="channelStats" class="mb-6"></div>
                <div class="min-w-[600px]" id="heatmap">
                    <p class="text-slate-600 text-sm">Loading...</p>
                </div>
            </div>
        </div>
    </main>


    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
