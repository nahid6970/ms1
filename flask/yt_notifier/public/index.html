<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myTUBE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#090d16',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body data-page="feed" class="h-full text-slate-100 flex flex-col font-sans antialiased selection:bg-red-500 selection:text-white">

    <div id="navbar"></div>

    <!-- Flash Messages -->
    <div id="flashMessages"></div>

    <!-- Main Content -->
    <main class="page-shell flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-20 text-center text-slate-600">
                <i class="fa-solid fa-circle-notch fa-spin text-5xl mb-4 opacity-30"></i>
                <p class="text-lg">Loading...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900/50 border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <p>YouTube Notifier App &bull; Built with Cloudflare Pages &amp; Convex &bull; Real-time RSS Feed Monitoring</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
