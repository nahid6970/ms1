<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attachment</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #f4f5fa; color: #25283a; font: 14px system-ui, sans-serif; }
    header { display: flex; align-items: center; min-height: 48px; padding: 0 16px; background: #fff; border-bottom: 1px solid #e2e5ef; }
    #fileName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    #message { margin: auto; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header><span id="fileName">Opening attachment…</span></header>
  <div id="message" hidden></div>
  <iframe id="fileFrame" title="Attachment preview"></iframe>
  <script src="attachment-viewer.js"></script>
</body>
</html>
