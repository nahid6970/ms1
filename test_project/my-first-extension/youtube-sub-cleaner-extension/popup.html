<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Sub Cleaner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="#ff0000"><path d="M23.5 6.2s-.2-1.6-.9-2.3c-.9-.9-1.9-.9-2.3-1C17.4 2.7 12 2.7 12 2.7s-5.4 0-8.3.2c-.5.1-1.5.1-2.3 1C.7 4.6.5 6.2.5 6.2S.3 8 .3 9.9v1.8c0 1.8.2 3.6.2 3.6s.2 1.6.9 2.3c.9.9 2 .9 2.5 1C5.6 18.8 12 18.8 12 18.8s5.4 0 8.3-.2c.5-.1 1.5-.1 2.3-1 .7-.7.9-2.3.9-2.3s.2-1.8.2-3.6V9.9c0-1.8-.2-3.7-.2-3.7zM9.7 13.4V7.4l6.3 3-6.3 3z"/></svg>
    <span class="title">Sub Cleaner</span>
  </div>

  <div class="controls">
    <div class="input-wrap">
      <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="#888"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3-9H9V6a3 3 0 0 1 6 0v2z"/></svg>
      <input type="password" id="api-key" placeholder="Enter YouTube API Key" autocomplete="off">
    </div>
    <button id="scan-btn" class="btn-scan">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7 14 5 12 5 9.5S7 5 9.5 5 14 7 14 9.5 12 14 9.5 14z"/></svg>
      Scan Subscriptions
    </button>
  </div>

  <!-- Sort bar — hidden until scan completes -->
  <div id="sort-bar" style="display:none;">
    <span class="sort-label">Sort:</span>
    <button class="sort-btn active" data-sort="oldest">Oldest first</button>
    <button class="sort-btn" data-sort="newest">Newest first</button>
    <button class="sort-btn" data-sort="az">A–Z</button>
  </div>

  <div id="channels-list"></div>

  <!-- Stats footer — hidden until scan completes -->
  <div id="stats-bar" style="display:none;"></div>

  <script src="popup.js"></script>
</body>
</html>
